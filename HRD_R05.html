<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
	layout:decorate="~{layout/layout}" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Reporting - HRD_R05 Employee Report</title>
</head>

<body>
	<div id="page-wrapper" layout:fragment="content">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a href="/reporting/">Reporting Dashboard</a></li>
				<li class="breadcrumb-item active" aria-current="page">HRD_R05 - Employee Report</li>
			</ol>
		</nav>

		<div class="alert alert-danger dngr" role="alert" th:if="${FailureMessage != null}" th:text="${FailureMessage}">
		</div>

		<div class="card shadow mb-4 mt-2">
			<div class="card-body">
				<div class="row">
					<div class="col-lg-12">
						<form id="HRD_R05" th:action="@{/hrd-reports/HRD_R05}" method="POST">

							<div class="form-group row ml-1 mr-1">
								<div class="col-sm-4 mb-3">
									<label class="custom-smile-form-label">Emp No</label>
									<select class="form-control" name="empNo" id="empNo">
										<option value="ALL">ALL</option>
										<option th:each="opt : ${employeeOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
									</select>
								</div>
								<div class="col-sm-4 mb-3">
									<label class="custom-smile-form-label">Designation</label>
									<select class="form-control" name="desigCd" id="desigCd">
										<option value="ALL">ALL</option>
										<option th:each="opt : ${designationOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
									</select>
								</div>
								<div class="col-sm-4 mb-3">
									<label class="custom-smile-form-label">Office ID</label>
									<select class="form-control" name="officeId" id="officeId">
										<option value="ALL">ALL</option>
										<option th:each="opt : ${officeOptions}" th:value="${opt.code}" th:text="${opt.label}"></option>
									</select>
								</div>
							</div>

							<div class="form-group row ml-1 mr-1">
								<div class="col-sm-4 mb-3">
									<label class="custom-smile-form-label">From Date (type ALL to skip)</label>
									<input type="text" class="form-control" name="fromDate" id="fromDate"
										placeholder="yyyy-MM-dd" value="ALL" pattern="ALL|[0-9]{4}-[0-9]{2}-[0-9]{2}"
										title="Enter ALL or a date in yyyy-MM-dd format">
								</div>
								<div class="col-sm-4 mb-3">
									<label class="custom-smile-form-label">To Date (type ALL to skip)</label>
									<input type="text" class="form-control" name="toDate" id="toDate"
										placeholder="yyyy-MM-dd" value="ALL" pattern="ALL|[0-9]{4}-[0-9]{2}-[0-9]{2}"
										title="Enter ALL or a date in yyyy-MM-dd format">
								</div>
							</div>

							<div class="text-center">
								<input type="submit" id="submit" class="btn custom-smile-btn-submit ml-1 mr-1"
									value="Submit">
								<input type="reset" value="Reset" class="btn custom-smile-btn-submit ml-1 mr-1">
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
